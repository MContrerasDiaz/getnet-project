<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Getnet PRD{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand" 
        href="{% if current_user.rol == 'admin' %}{{ url_for('index') }}{% else %}{{ url_for('index_limitado') }}{% endif %}">
        Getnet PRD
     </a>
             

        {% if current_user.is_authenticated %}
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    {% if current_user.rol == 'admin' %}
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('registrar_usuario') }}">Registrar</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('listar_usuarios') }}">Usuarios</a></li>
                        <!--<li class="nav-item"><a class="nav-link" href="{{ url_for('insert') }}">Insertar Terminal</a></li>-->
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('buscar_razon') }}">Razones</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('ver_logs') }}">Logs</a></li>
                    {% endif %}
                </ul>
                <span class="navbar-text me-3">
                    {{ current_user.nombre }} ({{ current_user.rol }})
                </span>
                <a class="btn btn-outline-light" href="{{ url_for('logout') }}">Cerrar sesión</a>
            </div>
        {% endif %}
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
